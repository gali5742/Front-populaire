name: G2-A engineering verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/g2-a.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'playwright.config.ts'
      - 'index.html'
      - 'docs/ACCEPTANCE_REGISTER.csv'
      - 'docs/MECHANISM*_DRAFT.md'
      - 'data/fixtures/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve dependencies (initial lock only)
        run: |
          node --version
          npm --version
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Save dependency lock for review
        uses: actions/upload-artifact@v4
        with:
          name: g2-a-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Recover verified bootstrap lock for repository sync
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const bytes = readFileSync('package-lock.json');
          const digest = createHash('sha256').update(bytes).digest('hex');
          const expected = '520e94729de7d861e03bd01ea4f39fdc19d83c36533220bc4f17b29388a3c7a1';
          if (digest !== expected) throw new Error('Bootstrap lock changed; review new artifact instead');
          const text = bytes.toString('base64');
          const chunks = text.match(/.{1,1024}/g);
          console.log('LOCK_SYNC_SHA256 ' + digest);
          chunks.forEach((chunk, index) => console.log('LOCK_SYNC_CHUNK ' + index + ' ' + chunk));
          console.log('LOCK_SYNC_COUNT ' + chunks.length);
          NODE
      - name: Typecheck, registry, unit tests and both builds
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Offline browser test
        run: npm run test:e2e
      - name: Upload verified engineering probe
        uses: actions/upload-artifact@v4
        with:
          name: g2-a-offline-probe
          path: dist-offline/front-probe.html
          if-no-files-found: error
