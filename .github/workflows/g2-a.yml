name: G2-A engineering verification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/g2-a.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'playwright.config.ts'
      - 'index.html'
      - 'docs/ACCEPTANCE_REGISTER.csv'
      - 'docs/MECHANISM*_DRAFT.md'
      - 'data/fixtures/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          node --version
          npm --version
          npm ci --no-audit --no-fund
      - name: Save dependency lock for review
        uses: actions/upload-artifact@v4
        with:
          name: g2-a-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Typecheck, registry, unit tests and both builds
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Offline browser test
        run: npm run test:e2e
      - name: Upload verified F1 slice
        uses: actions/upload-artifact@v4
        with:
          name: g2-b-offline-f1
          path: dist-offline/front-populaire-f1.html
          if-no-files-found: error
      - name: Upload verified engineering probe
        uses: actions/upload-artifact@v4
        with:
          name: g2-a-offline-probe
          path: dist-offline/front-probe.html
          if-no-files-found: error
